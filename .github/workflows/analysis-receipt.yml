name: Analysis receipt

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Existing Analysis test run ID to inspect; no new AI call or Telegram post'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: protocol-intel-monitor
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_BACKEND: s3
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.33'
      - run: uv sync --frozen --no-dev
      - run: uv run protocol-intel init-db
      - name: Inspect saved response and measure storage
        env:
          TEST_RUN_ID: ${{ inputs.run_id }}
        run: uv run protocol-intel analysis-receipt "$TEST_RUN_ID" receipt.md
      - name: Publish diagnostic receipt
        run: |
          cat receipt.md >> "$GITHUB_STEP_SUMMARY"
          cat receipt.md
