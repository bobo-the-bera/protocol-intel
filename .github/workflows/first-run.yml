name: First run

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'After checking storage, capture initial NEAR and HyperLend snapshots (no AI or alerts)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: protocol-intel-monitor
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_BACKEND: s3
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      COLLECTION_ENABLED: 'false'
      ANALYSIS_ENABLED: 'false'
      NOTIFICATIONS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.33'
      - run: uv sync --frozen --no-dev
      - name: Check required settings
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              exit 1
            fi
          done
          uv run protocol-intel validate
      - name: Prepare database
        run: |
          uv run protocol-intel init-db
          uv run protocol-intel sync-config
      - name: Check database and archive writes
        run: uv run protocol-intel storage-check
      - name: Verify archive from a fresh process
        id: storage
        run: uv run protocol-intel storage-check --verify-only
      - name: Baseline NEAR
        id: near
        if: inputs.baseline
        continue-on-error: true
        run: uv run protocol-intel baseline near
      - name: Baseline HyperLend
        id: hyperlend
        if: inputs.baseline
        continue-on-error: true
        run: uv run protocol-intel baseline hyperlend
      - name: Report setup result
        if: always()
        env:
          STORAGE_RESULT: ${{ steps.storage.outcome }}
          NEAR_RESULT: ${{ steps.near.outcome }}
          HYPERLEND_RESULT: ${{ steps.hyperlend.outcome }}
          BASELINE_REQUESTED: ${{ inputs.baseline }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          passed = os.environ['STORAGE_RESULT'] == 'success'
          lines = [f"Database/archive check: {'PASSED' if passed else 'FAILED or incomplete'}"]
          if os.environ['BASELINE_REQUESTED'] == 'true':
              for name in ('NEAR', 'HYPERLEND'):
                  result = os.environ[f'{name}_RESULT']
                  lines.append(f"{name} baseline: {result}")
                  passed = passed and result == 'success'
          lines.append('No AI analysis or Telegram alerts were requested. Scheduled monitoring is unchanged.')
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n\n'.join(lines) + '\n')
          if not passed:
              raise SystemExit(1)
          PY
