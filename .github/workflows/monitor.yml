name: Monitor

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Baseline first, then cycle. Analyze may use API credit; notify may post to Telegram.'
        required: true
        type: choice
        default: status
        options: [baseline, cycle, collect, analyze, digest, notify, status]
      protocol:
        description: 'Protocol ID required for baseline (near or hyperlend initially)'
        type: string
        default: near
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: protocol-intel-monitor
  cancel-in-progress: false

jobs:
  monitor:
    permissions:
      contents: read
      actions: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONITOR_TASK: ${{ inputs.task || 'cycle' }}
      PROTOCOL_ID: ${{ inputs.protocol || 'near' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_BACKEND: s3
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_DEEP_MODEL: ${{ vars.OPENAI_DEEP_MODEL || 'gpt-5.6-sol' }}
      OPENAI_DEEP_REASONING_EFFORT: ${{ vars.OPENAI_DEEP_REASONING_EFFORT || 'medium' }}
      OPENAI_SCREEN_MODEL: ${{ vars.OPENAI_SCREEN_MODEL || 'gpt-5.6-luna' }}
      OPENAI_SCREEN_REASONING_EFFORT: ${{ vars.OPENAI_SCREEN_REASONING_EFFORT || 'low' }}
      ANALYSIS_AUDIT_PERCENT: ${{ vars.ANALYSIS_AUDIT_PERCENT || '2' }}
      TELEGRAM_ALERT_MIN_IMPORTANCE: ${{ vars.TELEGRAM_ALERT_MIN_IMPORTANCE || 'HIGH' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COLLECTION_ENABLED: ${{ vars.COLLECTION_ENABLED || 'true' }}
      ANALYSIS_ENABLED: ${{ vars.ANALYSIS_ENABLED || 'true' }}
      NOTIFICATIONS_ENABLED: ${{ vars.NOTIFICATIONS_ENABLED || 'true' }}
      DAILY_DIGEST_ENABLED: ${{ vars.DAILY_DIGEST_ENABLED || 'true' }}
      DAILY_DIGEST_HOUR_UTC: ${{ vars.DAILY_DIGEST_HOUR_UTC || '8' }}
      PILOT_HOURS: '72'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.33'
      - run: uv sync --frozen --no-dev
      - name: Validate persistent runtime settings
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: $name. See docs/DEPLOYMENT.md."
              exit 1
            fi
          done
          if [ "$ANALYSIS_ENABLED" = true ] && [ -z "$OPENAI_API_KEY" ]; then
            echo 'ANALYSIS_ENABLED requires OPENAI_API_KEY.'
            exit 1
          fi
          if [ "$NOTIFICATIONS_ENABLED" = true ] && { [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; }; then
            echo 'NOTIFICATIONS_ENABLED requires both Telegram secrets.'
            exit 1
          fi
          uv run protocol-intel validate
          uv run protocol-intel init-db
          uv run protocol-intel sync-config
      - name: Run monitor task
        shell: bash
        run: |
          set -euo pipefail
          case "$MONITOR_TASK" in
            baseline) uv run protocol-intel baseline "$PROTOCOL_ID" ;;
            collect) uv run protocol-intel run-due --limit 2000 ;;
            analyze) uv run protocol-intel analyze --limit 5 ;;
            digest) uv run protocol-intel daily-digest ;;
            notify) uv run protocol-intel notify --limit 40 ;;
            status) uv run protocol-intel status; uv run protocol-intel failures ;;
            cycle) uv run protocol-intel cycle ;;
            *) exit 1 ;;
          esac
      - name: Publish cycle health
        if: always()
        run: |
          uv run protocol-intel status > health.json
          {
            echo '## Current monitor health'
            echo '```json'
            cat health.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat health.json
      - name: Disable this workflow when the pilot expires
        if: always()
        env:
          GH_STOP_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import urllib.request

          status = json.loads(subprocess.check_output(
              ['uv', 'run', 'protocol-intel', 'pilot-status'], text=True))
          if status['expired']:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/monitor.yml/disable",
                  method='PUT', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_STOP_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2026-03-10',
                  })
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError('Workflow disable was not acknowledged')
              print('72-hour pilot expired. Monitor workflow disabled; archived state preserved.')
          else:
              print(json.dumps(status))
