[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "protocol-intel"
version = "0.1.0"
description = "Deterministic protocol change archival, broad analysis, and Telegram alerts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2", "boto3>=1.35,<2", "httpx[socks]>=0.28,<0.29",
  "lxml>=5.3,<7", "openai>=2,<3", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "PyYAML>=6,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3", "typer>=0.15,<1",
]

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<0.23", "ruff>=0.9,<1", "types-PyYAML>=6"]

[project.scripts]
protocol-intel = "protocol_intel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/protocol_intel"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]
